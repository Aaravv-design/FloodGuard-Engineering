<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 500 180">

  <defs>
    <linearGradient id="steel"
                    x1="0%" y1="0%"
                    x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9E2EC"/>
      <stop offset="100%" stop-color="#7B8A9A"/>
    </linearGradient>
  </defs>

  <!-- Base -->
  <rect x="20" y="120"
        width="460"
        height="40"
        rx="8"
        fill="#374151"/>

  <!-- Barrier Panels -->
  <rect x="50" y="30"
        width="50"
        height="90"
        fill="url(#steel)"
        stroke="#4B5563"
        stroke-width="2"/>

  <rect x="120" y="30"
        width="50"
        height="90"
        fill="url(#steel)"
        stroke="#4B5563"
        stroke-width="2"/>

  <rect x="190" y="30"
        width="50"
        height="90"
        fill="url(#steel)"
        stroke="#4B5563"
        stroke-width="2"/>

  <rect x="260" y="30"
        width="50"
        height="90"
        fill="url(#steel)"
        stroke="#4B5563"
        stroke-width="2"/>

  <rect x="330" y="30"
        width="50"
        height="90"
        fill="url(#steel)"
        stroke="#4B5563"
        stroke-width="2"/>

  <rect x="400" y="30"
        width="50"
        height="90"
        fill="url(#steel)"
        stroke="#4B5563"
        stroke-width="2"/>

  <!-- Warning Stripe -->
  <rect x="20"
        y="160"
        width="460"
        height="10"
        fill="#FBBF24"/>
</svg>