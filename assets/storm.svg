<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 400">

<defs>

<linearGradient id="cloud"
x1="0%" y1="0%"
x2="0%" y2="100%">

<stop offset="0%" stop-color="#6B7280"/>
<stop offset="100%" stop-color="#374151"/>

</linearGradient>

<linearGradient id="bolt"
x1="0%"
y1="0%"
x2="0%"
y2="100%">

<stop offset="0%" stop-color="#FFF176"/>
<stop offset="100%" stop-color="#FBC02D"/>

</linearGradient>

</defs>

<!-- Cloud -->

<g>

<ellipse cx="220" cy="120" rx="80" ry="45" fill="url(#cloud)"/>
<ellipse cx="300" cy="100" rx="90" ry="55" fill="url(#cloud)"/>
<ellipse cx="390" cy="120" rx="85" ry="50" fill="url(#cloud)"/>
<ellipse cx="300" cy="145" rx="170" ry="50" fill="url(#cloud)"/>

</g>

<!-- Lightning -->

<polygon
fill="url(#bolt)"
points="
330,150
285,235
325,235
285,330
390,210
335,210
375,150">

<animate attributeName="opacity"
values="1;0;1;0;1"
dur="2s"
repeatCount="indefinite"/>

</polygon>

</svg>